name: CuidartePlus - DevSecOps CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            usuarios/pom.xml
            pacientes/pom.xml

      - name: JUnit 5 y JaCoCo - Usuarios
        working-directory: usuarios
        run: mvn -B -ntp clean verify

      - name: JUnit 5 y JaCoCo - Pacientes
        working-directory: pacientes
        run: mvn -B -ntp clean verify

      - name: Reportes JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-java
          path: |
            usuarios/target/site/jacoco/
            pacientes/target/site/jacoco/
          if-no-files-found: ignore

  seguridad:
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Snyk CLI
        uses: snyk/actions/setup@master

      - name: Revisar dependencias de Usuarios
        working-directory: usuarios
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --file=pom.xml --severity-threshold=high

      - name: Revisar dependencias de Pacientes
        if: success() || failure()
        working-directory: pacientes
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --file=pom.xml --severity-threshold=high

  despliegue:
    needs: [pruebas, seguridad]
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: cuidarte
      POSTGRES_PASSWORD: cuidarteplus
      POSTGRES_DB: cuidarteplus
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Construir imágenes Docker
        run: docker compose build

      - name: Desplegar entorno simulado
        run: docker compose up -d --wait --wait-timeout 240

      - name: Verificar microservicios
        run: |
          curl --fail --retry 4 --retry-delay 3 http://localhost:4444/health
          curl --fail --retry 4 --retry-delay 3 http://localhost:4445/health

      - name: Logs y contenedores
        if: always()
        run: docker compose ps && docker compose logs --tail=30

      - name: Apagar entorno simulado
        if: always()
        run: docker compose down -v
